name: Build TaptapNG (release, arm64)

# Release build of TaptapNG — a new Android app from scratch.
# UI mirrors v2rayNG 2.3.15 with Android Views (XML layouts +
# RecyclerView + Material Components, no Compose); protocols are
# in-app (Kotlin/Java, no bundled xray-core), so there is no native
# core build step. SSH (JSch, pure Java) is the Phase 1
# proof-of-concept protocol, proven by an end-to-end unit test
# against an in-process MINA SSHD server. Release is R8-minified
# and signed with the debug keystore (no release keystore exists
# yet) so the CI-built APK installs on the phone.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - v1014-from-109

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run unit tests (SSH + LinkParser round-trip + proto + ProfileStore + GroupsConfig repro/migration + ServerTester + MainToolbar)
      run: |
        cd ${{ github.workspace }}
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testDebugUnitTest

    - name: Decode release keystore (stable signing, v1.0.2+)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "ERROR: KEYSTORE_BASE64 secret is missing — without it the APK would be debug-signed and could not update v1.0.2+ (same failure as v1.0.1)" >&2
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/taptapng-release.keystore"
        ls -la "$RUNNER_TEMP/taptapng-release.keystore"

    - name: Build APK (release, R8)
      env:
        TAPTAPNG_KEYSTORE_PATH: ${{ runner.temp }}/taptapng-release.keystore
        TAPTAPNG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        TAPTAPNG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        TAPTAPNG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}
        ./gradlew :app:assembleRelease

    - name: Verify APK contents (no xray-core, no Compose, small APK)
      run: |
        APK=$(ls ${{ github.workspace }}/app/build/outputs/apk/release/*.apk | head -1)
        echo "APK=$APK"
        ls -la "$APK"
        # aapt2 is in the Android SDK build-tools.
        AAPT=$ANDROID_HOME/build-tools/37.0.0/aapt2
        "$AAPT" dump badging "$APK" | head -5
        unzip -l "$APK" | grep -E "classes.*\.dex|lib/|assets/|res/" | head -20
        # There must be NO bundled xray-core: no libgojni.so anywhere.
        if unzip -l "$APK" | grep -q "libgojni"; then
          echo "ERROR: libgojni.so found — xray-core must NOT be bundled" >&2
          exit 1
        fi
        # There must be NO Compose in the dex (Views-only UI).
        TMPDEX=$(mktemp -d)
        unzip -q -o "$APK" 'classes*.dex' -d "$TMPDEX"
        if strings "$TMPDEX"/classes*.dex | grep -qi "androidx/compose"; then
          echo "ERROR: androidx.compose found in dex — UI must be Views-only" >&2
          exit 1
        fi
        echo "DEX files:"
        ls -la "$TMPDEX"
        echo "APK size (bytes): $(stat -c%s "$APK")"
        echo "APK SHA256: $(sha256sum "$APK" | cut -d' ' -f1)"
        # v1.0.2+: the signing certificate fingerprint MUST be the
        # stable release key (SHA-256 D4:65:AE:E6:88:79:87:34:08:EB:
        # C6:54:24:87:00:34:5A:F8:4D:FF:CE:50:76:C0:C8:57:91:50:DE:
        # 98:A8:92). It must differ from v1.0.1's ephemeral debug
        # key (47:F2:F4:EC:...) and stay identical on every build
        # from here on — a different fingerprint means the update
        # will fail on the phone ("tidak konsisten dengan tanda
        # tangan APK yang diinstal").
        APKSIGNER=$ANDROID_HOME/build-tools/37.0.0/apksigner
        echo "APK signing certificates:"
        "$APKSIGNER" verify --print-certs "$APK"

    - name: Upload APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: taptapng-v1.0.21-release
        path: ${{ github.workspace }}/app/build/outputs/apk/release/*.apk

    - name: Upload R8 mapping (diagnose obfuscated names)
      # v1.0.18: v1.0.17 shipped WITHOUT a mapping, so the
      # "n20 cannot be cast to ec0" toast could only be decoded by
      # hand from classes.dex. Keep the mapping with every release.
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: taptapng-v1.0.21-mapping
        path: ${{ github.workspace }}/app/build/outputs/mapping/release/mapping.txt
