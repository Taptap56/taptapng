[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
appcompat = "1.8.0"
activity = "1.10.1"
material = "1.13.0"
recyclerview = "1.4.0"
preference = "1.2.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
gson = "2.14.0"
jsch = "0.2.21"
sshd = "2.12.0"
bouncycastle = "1.86"
junit = "6.1.3"
zxing = "3.5.3"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# Onering (M4, v1.0.23): Bouncy Castle TLS client — the ONLY way to
# send a custom 0xff00 extension as the FIRST ClientHello extension
# (SSLSocket/SSLEngine expose no custom-extension API, and patching
# the generated ClientHello bytes breaks the TLS transcript hash).
# Crypto is BC-native (BcTlsCrypto): the JCA path (JcaTlsCryptoProvider)
# dies on TLS 1.3 RSA-PSS CertificateVerify ("SHA256WITHRSAANDMGF1"
# not available on the platform JCA). bcprov rides in transitively
# (bctls -> bcutil -> bcprov). 1.86 is >= 1.85 (CVE-2026-58062
# cert-validation fix). R8 shrinks it to the reachable TLS client
# code; the release APK size is checked in CI.
bctls = { module = "org.bouncycastle:bctls-jdk15to18", version.ref = "bouncycastle" }
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
